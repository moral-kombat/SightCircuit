name: ARM64 checks

# Steam Frame is ARM64. These run the same synthetic native and Python suites
# that were previously repeated by hand on the headset; they do not replace
# device validation of drivers, SteamVR or cameras.
#
# Runs on main pushes and on demand, not on pull requests: x86_64 covers each
# pull request, and an ARM64 run of a branch is one click away (Actions, "ARM64
# checks", "Run workflow", pick the branch; tick "pacing" for the runner-CPU
# replay reports). The documentation-only list matches checks.yml and docs.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/evidence/**'
      - 'docs/status.md'
      - 'docs/status-data.json'
      - 'docs/architecture.md'
      - 'docs/README.md'
      - 'docs/agent-on-frame.md'
      - 'docs/capture-reference-review.md'
      - 'docs/design-review.md'
      - 'docs/documentation-plan.md'
      - 'docs/execution-prompt.md'
      - 'docs/lifecycle-review.md'
      - 'docs/morning-checklist.md'
      - 'docs/poc-scope.md'
      - 'docs/project-history.md'
      - 'docs/steam-frame-camera.md'
      - 'docs/vr-overlay.md'
      - 'docs/glossary.md'
      - 'docs/legacy-anchors.json'
      - 'docs/history-rewrite-2026-11-07.txt'
      - 'docs/history/**'
      - 'docs/guides/replay.md'
      - 'docs/guides/mirror-recognition.md'
      - 'docs/guides/frame-sessions.md'
      - 'docs/reference/capture-device-checks.md'
      - 'docs/reference/detection.md'
      - 'docs/reference/detector-evaluation.md'
      - 'docs/reference/development-checks.md'
      - 'docs/reference/hud-runtime.md'
      - 'docs/reference/hud-session.md'
      - 'docs/reference/mirror.md'
      - 'docs/reference/overlay.md'
      - 'docs/reference/replay.md'
      - 'docs/reference/shared-memory.md'
      - 'patches/mrhand/README.md'
      - 'third_party/mrhand/README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/instructions/**'
  workflow_dispatch:
    inputs:
      pacing:
        description: Replay the synthetic stand-in in real time and upload runner-CPU reports (not Frame results)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64:
    uses: ./.github/workflows/check-jobs.yml
    with:
      runner: ubuntu-24.04-arm
      pacing: ${{ github.event_name == 'workflow_dispatch' && inputs.pacing }}
