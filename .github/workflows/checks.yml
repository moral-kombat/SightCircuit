name: Development checks

# x86_64 checks for every pull request and main push. A change that touches
# only the documentation paths below runs docs.yml instead; the same list is
# in arm64.yml and docs.yml, and tests/test_workflows.py keeps the three
# identical and off every test module's inputs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/evidence/**'
      - 'docs/status.md'
      - 'docs/status-data.json'
      - 'docs/architecture.md'
      - 'docs/README.md'
      - 'docs/capture-reference-review.md'
      - 'docs/design-review.md'
      - 'docs/documentation-plan.md'
      - 'docs/execution-prompt.md'
      - 'docs/lifecycle-review.md'
      - 'docs/morning-checklist.md'
      - 'docs/poc-scope.md'
      - 'docs/project-history.md'
      - 'docs/steam-frame-camera.md'
      - 'docs/vr-overlay.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/instructions/**'
  pull_request:
    paths-ignore:
      - 'docs/evidence/**'
      - 'docs/status.md'
      - 'docs/status-data.json'
      - 'docs/architecture.md'
      - 'docs/README.md'
      - 'docs/capture-reference-review.md'
      - 'docs/design-review.md'
      - 'docs/documentation-plan.md'
      - 'docs/execution-prompt.md'
      - 'docs/lifecycle-review.md'
      - 'docs/morning-checklist.md'
      - 'docs/poc-scope.md'
      - 'docs/project-history.md'
      - 'docs/steam-frame-camera.md'
      - 'docs/vr-overlay.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/instructions/**'
  workflow_dispatch:

# A newer push to the same pull request cancels its superseded run. Main
# pushes and manual runs are grouped by commit, so none is ever cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  x86_64:
    uses: ./.github/workflows/check-jobs.yml
    with:
      runner: ubuntu-24.04
      lint: true
      smoke: true
