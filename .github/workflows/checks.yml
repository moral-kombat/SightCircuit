name: Development checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Python with the configuration in pyproject.toml
        run: |
          python -m pip install ruff==0.14.2
          ruff check .

  x86_64:
    uses: ./.github/workflows/check-jobs.yml
    with:
      runner: ubuntu-24.04
      smoke: true
