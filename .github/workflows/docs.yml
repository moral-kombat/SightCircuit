name: Documentation checks

# Documentation-only changes check local links, compatibility anchors, generated
# summaries/catalog and the validators' tests. The path list matches paths-ignore
# in checks.yml and arm64.yml. Documents read by application tests stay on the
# full run; that route also runs the documentation validators.
on:
  push:
    branches: [main]
    paths:
      - 'docs/evidence/**'
      - 'docs/status.md'
      - 'docs/status-data.json'
      - 'docs/architecture.md'
      - 'docs/README.md'
      - 'docs/agent-on-frame.md'
      - 'docs/capture-reference-review.md'
      - 'docs/design-review.md'
      - 'docs/documentation-plan.md'
      - 'docs/execution-prompt.md'
      - 'docs/lifecycle-review.md'
      - 'docs/morning-checklist.md'
      - 'docs/poc-scope.md'
      - 'docs/project-history.md'
      - 'docs/steam-frame-camera.md'
      - 'docs/vr-overlay.md'
      - 'docs/glossary.md'
      - 'docs/legacy-anchors.json'
      - 'docs/history-rewrite-2026-11-07.txt'
      - 'docs/history/**'
      - 'docs/guides/replay.md'
      - 'docs/guides/mirror-recognition.md'
      - 'docs/guides/frame-sessions.md'
      - 'docs/reference/capture-device-checks.md'
      - 'docs/reference/detection.md'
      - 'docs/reference/detector-evaluation.md'
      - 'docs/reference/development-checks.md'
      - 'docs/reference/hud-runtime.md'
      - 'docs/reference/hud-session.md'
      - 'docs/reference/mirror.md'
      - 'docs/reference/overlay.md'
      - 'docs/reference/replay.md'
      - 'docs/reference/shared-memory.md'
      - 'patches/mrhand/README.md'
      - 'third_party/mrhand/README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/instructions/**'
  pull_request:
    paths:
      - 'docs/evidence/**'
      - 'docs/status.md'
      - 'docs/status-data.json'
      - 'docs/architecture.md'
      - 'docs/README.md'
      - 'docs/agent-on-frame.md'
      - 'docs/capture-reference-review.md'
      - 'docs/design-review.md'
      - 'docs/documentation-plan.md'
      - 'docs/execution-prompt.md'
      - 'docs/lifecycle-review.md'
      - 'docs/morning-checklist.md'
      - 'docs/poc-scope.md'
      - 'docs/project-history.md'
      - 'docs/steam-frame-camera.md'
      - 'docs/vr-overlay.md'
      - 'docs/glossary.md'
      - 'docs/legacy-anchors.json'
      - 'docs/history-rewrite-2026-11-07.txt'
      - 'docs/history/**'
      - 'docs/guides/replay.md'
      - 'docs/guides/mirror-recognition.md'
      - 'docs/guides/frame-sessions.md'
      - 'docs/reference/capture-device-checks.md'
      - 'docs/reference/detection.md'
      - 'docs/reference/detector-evaluation.md'
      - 'docs/reference/development-checks.md'
      - 'docs/reference/hud-runtime.md'
      - 'docs/reference/hud-session.md'
      - 'docs/reference/mirror.md'
      - 'docs/reference/overlay.md'
      - 'docs/reference/replay.md'
      - 'docs/reference/shared-memory.md'
      - 'patches/mrhand/README.md'
      - 'third_party/mrhand/README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
      - 'README.md'
      - 'THIRD_PARTY.md'
      - '.github/instructions/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify links, compatibility anchors and generated summaries
        run: |
          python3 scripts/check_docs.py
          python3 scripts/generate_status.py --check
      - name: Verify the documentation validators
        run: |
          python3 -m unittest discover -s tests -p test_check_docs.py -v
          python3 -m unittest discover -s tests -p test_generate_status.py -v
