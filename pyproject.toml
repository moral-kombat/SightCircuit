[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sightcircuit"
version = "0.1.0"
description = "Object recognition for Steam Frame recordings and bounded live input"
readme = "README.md"
license = "MIT"
# The two interpreter versions the pinned sets are tested with: 3.12 (CI, the
# x86_64 smoke environment) and 3.14 (the Frame since SteamOS 0.5.8, proven on
# x86_64 in the cloud). 3.13 is untested and refused by the setup scripts.
requires-python = ">=3.12,!=3.13.*,<3.15"
dependencies = []

# Exact, tested-together pins remain in requirements-*.txt, which the setup
# scripts install. These extras state compatible ranges for editable installs.
[project.optional-dependencies]
replay = ["av>=16.1"]
window = [
    "sightcircuit[replay]",
    "numpy>=2.2",
    "opencv-python-headless>=4.12,<5",  # MobileNet-SSD needs OpenCV 4's Caffe importer.
    "pyside6-essentials>=6.12",
]
dev = ["sightcircuit[window]", "onnxruntime>=1.31", "ruff==0.14.2"]

# Console entry points of the active commands; scripts/<name>.py wraps each
# for the uninstalled checkout (docs/development.md, "Commands and entry points").
[project.scripts]
sightcircuit-replay-window = "sightcircuit.commands.replay_window:main"
sightcircuit-mirror-recognize = "sightcircuit.commands.mirror_recognize:main"
sightcircuit-live-pipeline = "sightcircuit.commands.live_pipeline:main"
sightcircuit-hud-marker-check = "sightcircuit.commands.hud_marker_check:main"
sightcircuit-hud-marker-observer = "sightcircuit.commands.hud_marker_observer:main"
sightcircuit-hud-validation-report = "sightcircuit.commands.hud_validation_report:main"
sightcircuit-evaluate-detectors = "sightcircuit.commands.evaluate_detectors:main"
sightcircuit-generate-status = "sightcircuit.commands.generate_status:main"
sightcircuit-mirror-check = "sightcircuit.commands.mirror_check:main"
sightcircuit-frame-session-manifest = "sightcircuit.commands.frame_session_manifest:main"
sightcircuit-annotate-boxes = "sightcircuit.commands.annotate_boxes:main"
sightcircuit-agent-enforcement-check = "sightcircuit.commands.agent_enforcement_check:main"
sightcircuit-fallback-measure = "sightcircuit.commands.fallback_measure:main"
sightcircuit-camera-recognize = "sightcircuit.commands.camera_recognize:main"

[tool.setuptools.packages.find]
include = ["sightcircuit*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".cache", "artifacts"]

[tool.ruff.lint]
# Pyflakes and pycodestyle errors. Long legacy lines (E501) and compact
# one-line statements (E701/E702) in existing code are not yet enforced.
select = ["E4", "E7", "E9", "F", "W6"]
ignore = ["E701", "E702"]
